name: Deploy to Vercel

# Every push to main deploys the live site. Uses a Vercel token stored as the
# repository secret VERCEL_TOKEN (Settings > Secrets and variables > Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check the token is set
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Add the VERCEL_TOKEN repository secret first." && exit 1
          fi
      # Pinned so a new Vercel CLI release never runs with the deploy token unreviewed. Bump on purpose.
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@65.16.0 deploy --prod --yes \
            --token "$VERCEL_TOKEN" \
            --scope sksjjs-projects
